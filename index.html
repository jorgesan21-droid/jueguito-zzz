<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNDERTALE WEB - El Michi del Sombrero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            border-radius: 0 !important;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: "Press Start 2P", "Courier New", Courier, monospace;
            font-weight: normal;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 12px;
            touch-action: manipulation;
        }

        .game-container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .phase-banner {
            font-size: 12px;
            color: #00ffff;
            text-align: center;
            letter-spacing: 1px;
        }

        .controls-hint {
            font-size: 10px;
            color: #bbb;
            text-align: center;
            line-height: 1.6;
        }

        .mechanic-legend {
            font-size: 9px;
            color: #ccc;
            text-align: center;
            line-height: 1.6;
        }

        /* ZONA DEL ENEMIGO (GATO PIXEL BLANCO Y NEGRO GRANDE) */
        .enemy-area {
            min-height: 205px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
        }

        .cat-boss {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: float 1.4s steps(4) infinite;
            transition: transform 0.12s steps(3);
        }

        .cat-boss.dodge-jump {
            transform: translateX(76px) translateY(-22px) rotate(12deg);
        }

        #catPixelCanvas {
            width: 184px;
            height: 164px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        .cat-boss.shake {
            animation: shake 0.24s steps(2);
        }

        .enemy-hp-bar {
            width: 210px;
            height: 16px;
            background: #000;
            border: 3px solid #fff;
            margin-top: 8px;
            display: none;
        }

        .enemy-hp-fill {
            height: 100%;
            background: #00ff00;
            width: 100%;
            transition: width 0.2s steps(6);
        }

        /* BURBUJA DE DIÁLOGO PIXEL DEL ENEMIGO */
        .speech-bubble {
            position: absolute;
            right: -6px;
            top: 14px;
            background: #fff;
            color: #000;
            border: 3px solid #fff;
            padding: 10px;
            font-size: 10px;
            width: 215px;
            line-height: 1.5;
            display: none;
            z-index: 5;
        }

        /* CAJA PRINCIPAL DE BATALLA / DIÁLOGO */
        .battle-box {
            width: 100%;
            height: 215px;
            border: 4px solid #fff;
            background: #000;
            position: relative;
            overflow: hidden;
            padding: 15px;
            transition: width 0.2s steps(4), height 0.2s steps(4);
        }

        .battle-box.combat-mode {
            width: 288px;
            height: 236px;
            padding: 0;
        }

        .dialogue-text {
            font-size: 11px;
            line-height: 1.75;
            color: #fff;
        }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 11px;
            margin-top: 2px;
        }

        .option-item {
            font-size: 11px;
            line-height: 1.45;
            cursor: pointer;
            padding-left: 24px;
            position: relative;
        }

        .option-item.selected {
            color: #ffff00;
        }

        .option-item.selected::before {
            content: '♥';
            color: #ff0000;
            position: absolute;
            left: 0;
            top: 0;
            font-size: 12px;
        }

        #bulletCanvas, #attackCanvas, #deathCanvas {
            display: none;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* BARRA DE VIDA Y CONTADOR DE VIDA DEL JEFE */
        .stats-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .hp-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hp-bar {
            width: 130px;
            height: 18px;
            background: #ff0000;
            border: 2px solid #fff;
        }

        .hp-fill {
            height: 100%;
            background: #ffff00;
            width: 100%;
            transition: width 0.2s steps(5);
        }

        /* 4 BOTONES DE ACCIÓN UNDERTALE */
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            margin-top: 4px;
        }

        .btn {
            background-color: #000;
            border: 3px solid #ff8c00;
            color: #ff8c00;
            font-family: "Press Start 2P", "Courier New", Courier, monospace;
            font-size: 11px;
            padding: 12px 6px;
            cursor: pointer;
            text-align: center;
            transition: transform 0.08s steps(2), border-color 0.08s, color 0.08s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .btn:hover:not(:disabled),
        .btn.active-btn:not(:disabled) {
            border-color: #ffff00;
            color: #ffff00;
            transform: translate(-1px, -1px);
        }

        .btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        /* CONTROLES EXCLUSIVOS DE DISPOSITIVOS MÓVILES (JOYSTICK + Z / X) */
        .mobile-controls {
            display: none;
            width: 100%;
            max-width: 420px;
            justify-content: space-between;
            align-items: center;
            gap: 18px;
            margin-top: 10px;
            padding: 6px 8px;
            touch-action: none;
        }

        .joystick-base {
            width: 124px;
            height: 124px;
            border: 3px solid #ffffff;
            background-color: #0b0b0b;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            flex-shrink: 0;
        }

        .joystick-crosshair-h {
            position: absolute;
            width: 78%;
            height: 2px;
            background: rgba(255, 255, 255, 0.16);
            pointer-events: none;
        }

        .joystick-crosshair-v {
            position: absolute;
            width: 2px;
            height: 78%;
            background: rgba(255, 255, 255, 0.16);
            pointer-events: none;
        }

        .joystick-knob {
            width: 48px;
            height: 48px;
            border: 3px solid #ffff00;
            background-color: #1a1a1a;
            color: #ffff00;
            font-size: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            pointer-events: none;
            transform: translate(0px, 0px);
        }

        .joystick-knob.active {
            background-color: #ffff00;
            color: #000000;
        }

        .zx-pad {
            display: flex;
            flex-direction: column;
            gap: 12px;
            touch-action: none;
        }

        .zx-btn {
            background: #000;
            border: 3px solid #fff;
            color: #fff;
            font-family: "Press Start 2P", "Courier New", Courier, monospace;
            width: 76px;
            height: 56px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            cursor: pointer;
            touch-action: none;
        }

        .zx-btn .sub-label {
            font-size: 8px;
            color: #bbb;
        }

        .zx-btn.z-btn {
            border-color: #ffff00;
            color: #ffff00;
        }

        .zx-btn.z-btn.pressed,
        .zx-btn.z-btn:active {
            background: #ffff00;
            color: #000000;
        }

        .zx-btn.x-btn {
            border-color: #00ffff;
            color: #00ffff;
        }

        .zx-btn.x-btn.pressed,
        .zx-btn.x-btn:active {
            background: #00ffff;
            color: #000000;
        }

        /* Mostrar controles móviles SOLO en dispositivos móviles / táctiles */
        @media (hover: none) and (pointer: coarse), (max-width: 768px) {
            .mobile-controls { display: flex; }
            .speech-bubble {
                position: static;
                margin-top: 10px;
                width: 260px;
            }
            .enemy-area { height: auto; margin-bottom: 4px; }
            .action-buttons { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .btn { font-size: 10px; padding: 11px 4px; }
            .dialogue-text { font-size: 10px; }
            .option-item { font-size: 10px; }
            .phase-banner { font-size: 10px; }
        }

        @media (max-width: 390px) {
            .joystick-base {
                width: 108px;
                height: 108px;
            }
            .joystick-knob {
                width: 42px;
                height: 42px;
            }
            .zx-btn {
                width: 66px;
                height: 50px;
                font-size: 11px;
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body tabindex="0">

<div class="game-container">
    <div class="phase-banner" id="phaseBanner">FASE I (SUAVE) • ETAPA 1</div>
    <div class="controls-hint">[W A S D] Mover &nbsp;|&nbsp; [Z / ESPACIO / CLIC] Continuar &nbsp;|&nbsp; [X] Regresar</div>
    <div class="mechanic-legend">
        <span style="color:#00ffff;">■ AZUL: Quieto</span> &nbsp;|&nbsp;
        <span style="color:#ff9900;">■ NARANJA: Muévete</span> &nbsp;|&nbsp;
        <span style="color:#ffff00;">■ AMARILLA: Giro felino</span>
    </div>

    <!-- ENEMIGO: GATO PIXEL BLANCO Y NEGRO GRANDE -->
    <div class="enemy-area">
        <div class="cat-boss" id="catBoss">
            <canvas id="catPixelCanvas" width="92" height="82"></canvas>
        </div>
        <div class="enemy-hp-bar" id="enemyHpBar">
            <div class="enemy-hp-fill" id="enemyHpFill"></div>
        </div>
        <div class="speech-bubble" id="speechBubble"></div>
    </div>

    <!-- CAJA DE BATALLA -->
    <div class="battle-box" id="battleBox" onclick="handleBoxClick()">
        <div class="dialogue-text" id="dialogueText"></div>
        <div class="menu-options" id="menuOptions" style="display: none;"></div>
        <canvas id="attackCanvas" width="600" height="170"></canvas>
        <canvas id="bulletCanvas" width="272" height="222"></canvas>
        <canvas id="deathCanvas" width="600" height="170"></canvas>
    </div>

    <!-- ESTADÍSTICAS DEL JUGADOR -->
    <div class="stats-bar">
        <span>TÚ &nbsp; NV 1</span>
        <span id="bossHpCounter">MICHI: 300 / 300 PS</span>
        <div class="hp-container">
            <span>PS</span>
            <div class="hp-bar"><div class="hp-fill" id="playerHpFill"></div></div>
            <span id="hpText">70 / 70</span>
        </div>
    </div>

    <!-- 4 BOTONES DE ACCIÓN -->
    <div class="action-buttons" id="actionButtons">
        <button type="button" class="btn active-btn" id="btnFight" onclick="clickMainBtn(0)">⚔ LUCHAR</button>
        <button type="button" class="btn" id="btnAct" onclick="clickMainBtn(1)">💬 ACTUAR</button>
        <button type="button" class="btn" id="btnItem" onclick="clickMainBtn(2)">🎒 OBJETO</button>
        <button type="button" class="btn" id="btnMercy" onclick="clickMainBtn(3)">💛 PIEDAD</button>
    </div>

    <!-- CONTROLES EXCLUSIVOS MÓVILES: JOYSTICK + BOTONES Z Y X -->
    <div class="mobile-controls" id="mobileControls" aria-hidden="true">
        <div class="joystick-base" id="joystickBase">
            <div class="joystick-crosshair-h"></div>
            <div class="joystick-crosshair-v"></div>
            <div class="joystick-knob" id="joystickKnob">♥</div>
        </div>
        <div class="zx-pad">
            <button type="button" class="zx-btn z-btn" id="padZ">Z<span class="sub-label">OK</span></button>
            <button type="button" class="zx-btn x-btn" id="padX">X<span class="sub-label">ATRÁS</span></button>
        </div>
    </div>
</div>

<script>
    // --- AUDIO RETRO ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBlip(freq = 420, duration = 0.04, type = 'square') {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // --- CONFIGURACIÓN DE COMBATE ---
    const maxEnemyHp = 300;
    const maxPlayerHp = 70;
    let playerHp = maxPlayerHp;
    let enemyHp = maxEnemyHp;
    let mercyPoints = 0;
    let turnCount = 0;
    let isTyping = false;
    let currentFullText = "";
    let currentTypeCallback = null;
    let inCombat = false;
    let inAttackBar = false;
    let gameOver = false;
    let spawnTimer = null;
    let turnEndTimer = null;

    // Estado de secuencia de mensajes finales al derrotarlo
    let finalSequenceActive = false;
    let finalMessageIndex = 0;
    let finalMessageReadyToAdvance = false;

    const defeatRewardParts = [
        "Ja, me ganaste... porque nomás mi creador te ama demasiado, miau.",
        "Ejem... él me dijo que te dijera cuánto te quiere y te ama, así que supongo que tengo que decírtelo, miau.",
        "Él te ama mucho más de lo que crees, eres lo mejor que le ha pasado en su vida.",
        "Te ama; ama cada pequeño detalle que tienes, ama cómo eres y cómo lo haces sentir.",
        "No eres otra persona más en su vida: eres alguien a quien él quiere cuidar y comprender cada día de una mejor forma, además de hacerte feliz, claro.",
        "Así que ni se te ocurra dudar, miau, de lo que él siente por ti, miau.",
        "Él te ama por quien eres; así digas que tienes varias cosas malas, él cree que eres perfecta tal y como eres.",
        "Eres la única, miauu, que él ama de esta forma tan exagerada. ♥",
        "Buuuuu, te amo mucho mi princesita hermosa."
    ];

    const tauntLines = [
        "¡No me vas a ganar miau, Buuuuuu no sirves para nadaaa",
        "¡Eres de lo peor, miau! No me puedes ganar tonta",
        "¡Das verguenza amorcito, ya parale porfis",
        "Ni una me das",
        "¡No te ama, miau! Apenas me creó para que des lastima pero ya ni nombre tiene esta humillación"
    ];

    const difficultyPhases = [
        {
            name: "FASE I: DIFICULTAD SUAVE",
            color: "#7cfc00",
            attacks: [5, 3, 6]
        },
        {
            name: "FASE II: DIFICULTAD MEDIA",
            color: "#ffff00",
            attacks: [0, 2, 7]
        },
        {
            name: "FASE III: DIFICULTAD ALTA",
            color: "#ff5555",
            attacks: [1, 4, 8, 9]
        }
    ];

    let menuState = 'MAIN';
    let selectedMainIdx = 0;
    let selectedSubIdx = 0;
    let subOptionCallbacks = [];
    let lastMainDialogue = "* El Michi del Sombrero te mira con burla.\n* ¿Qué harás? [Z] para elegir.";

    const mainActions = ['fight', 'act', 'item', 'mercy'];
    const mainBtnEls = [
        document.getElementById('btnFight'),
        document.getElementById('btnAct'),
        document.getElementById('btnItem'),
        document.getElementById('btnMercy')
    ];

    let items = [
        { name: "Atún en Latita", heal: 22 },
        { name: "Leche Tibia", heal: 20 },
        { name: "Hierba Gatera", heal: 18 }
    ];

    // DOM
    const phaseBanner = document.getElementById('phaseBanner');
    const bossHpCounter = document.getElementById('bossHpCounter');
    const dialogueText = document.getElementById('dialogueText');
    const menuOptions = document.getElementById('menuOptions');
    const battleBox = document.getElementById('battleBox');
    const canvas = document.getElementById('bulletCanvas');
    const ctx = canvas.getContext('2d');
    const atkCanvas = document.getElementById('attackCanvas');
    const atkCtx = atkCanvas.getContext('2d');
    const deathCanvas = document.getElementById('deathCanvas');
    const deathCtx = deathCanvas.getContext('2d');
    const catPixelCanvas = document.getElementById('catPixelCanvas');
    const catPixelCtx = catPixelCanvas.getContext('2d');
    const speechBubble = document.getElementById('speechBubble');
    const catBoss = document.getElementById('catBoss');

    ctx.imageSmoothingEnabled = false;
    atkCtx.imageSmoothingEnabled = false;
    deathCtx.imageSmoothingEnabled = false;
    catPixelCtx.imageSmoothingEnabled = false;

    let bossMood = "normal";

    function px(c, x, y, w, h, color) {
        c.fillStyle = color;
        c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
    }

    function drawPixelCatBoss() {
        const c = catPixelCtx;
        c.clearRect(0, 0, catPixelCanvas.width, catPixelCanvas.height);

        const W = "#ffffff";
        const B = "#000000";

        if (bossMood === "defeated") {
            px(c, 28, 36, 36, 20, W);
            px(c, 22, 40, 48, 12, W);
            px(c, 34, 28, 24, 12, W);
            px(c, 32, 42, 4, 4, B);
            px(c, 54, 42, 4, 4, B);
            return;
        }

        px(c, 28, 4, 36, 16, W);
        px(c, 30, 6, 32, 12, B);
        px(c, 30, 15, 32, 3, W);
        px(c, 18, 20, 56, 5, W);
        px(c, 20, 21, 52, 3, B);
        px(c, 22, 22, 48, 1, W);

        px(c, 62, 54, 8, 5, W);
        px(c, 64, 55, 5, 3, B);
        px(c, 67, 45, 6, 12, W);
        px(c, 69, 47, 3, 8, B);
        px(c, 69, 40, 6, 6, W);

        px(c, 26, 48, 40, 24, W);
        px(c, 28, 50, 36, 20, B);
        px(c, 36, 52, 20, 16, W);
        px(c, 38, 54, 16, 14, B);

        px(c, 29, 71, 10, 7, W);
        px(c, 31, 73, 6, 4, B);
        px(c, 53, 71, 10, 7, W);
        px(c, 55, 73, 6, 4, B);

        px(c, 64, 50, 4, 28, W);
        px(c, 65, 52, 2, 24, B);
        px(c, 62, 47, 8, 4, W);
        px(c, 64, 48, 4, 2, B);

        px(c, 22, 25, 11, 11, W);
        px(c, 24, 27, 7, 7, B);
        px(c, 26, 29, 4, 4, W);

        px(c, 59, 25, 11, 11, W);
        px(c, 61, 27, 7, 7, B);
        px(c, 62, 29, 4, 4, W);

        px(c, 20, 32, 52, 21, W);
        px(c, 22, 34, 48, 17, B);
        px(c, 42, 34, 8, 4, W);
        px(c, 44, 35, 4, 2, B);

        if (bossMood === "broken") {
            px(c, 30, 38, 3, 3, W); px(c, 36, 38, 3, 3, W);
            px(c, 33, 41, 3, 3, W);
            px(c, 30, 44, 3, 3, W); px(c, 36, 44, 3, 3, W);

            px(c, 53, 38, 3, 3, W); px(c, 59, 38, 3, 3, W);
            px(c, 56, 41, 3, 3, W);
            px(c, 53, 44, 3, 3, W); px(c, 59, 44, 3, 3, W);
        } else if (bossMood === "happy") {
            px(c, 29, 42, 3, 2, W); px(c, 32, 40, 3, 2, W); px(c, 35, 42, 3, 2, W);
            px(c, 54, 42, 3, 2, W); px(c, 57, 40, 3, 2, W); px(c, 60, 42, 3, 2, W);
        } else {
            px(c, 28, 37, 10, 10, W);
            px(c, 31, 40, 4, 5, B);
            px(c, 30, 39, 2, 2, W);

            px(c, 54, 37, 10, 10, W);
            px(c, 57, 40, 4, 5, B);
            px(c, 56, 39, 2, 2, W);

            if (bossMood === "angry") {
                px(c, 28, 35, 11, 2, W);
                px(c, 53, 35, 11, 2, W);
            }
        }

        px(c, 44, 44, 4, 3, W);
        if (bossMood === "happy") {
            px(c, 38, 47, 4, 2, W);
            px(c, 42, 48, 8, 2, W);
            px(c, 50, 47, 4, 2, W);
        } else if (bossMood === "angry") {
            px(c, 39, 48, 14, 2, W);
            px(c, 41, 48, 2, 2, B);
            px(c, 49, 48, 2, 2, B);
        } else {
            px(c, 39, 47, 4, 2, W);
            px(c, 49, 47, 4, 2, W);
            px(c, 43, 48, 6, 2, W);
        }

        px(c, 10, 41, 8, 2, W);
        px(c, 11, 46, 7, 2, W);
        px(c, 74, 41, 8, 2, W);
        px(c, 74, 46, 7, 2, W);
    }

    function getCurrentDifficultyPhase() {
        const hpRatio = enemyHp / maxEnemyHp;
        if (hpRatio > 0.65) return difficultyPhases[0];
        if (hpRatio > 0.32) return difficultyPhases[1];
        return difficultyPhases[2];
    }

    function pickNextAttackId() {
        const phase = getCurrentDifficultyPhase();
        return phase.attacks[turnCount % phase.attacks.length];
    }

    function highlightMainBtn() {
        mainBtnEls.forEach((btn, idx) => {
            if (idx === selectedMainIdx) btn.classList.add('active-btn');
            else btn.classList.remove('active-btn');
        });
    }

    function highlightSubOption() {
        const opts = menuOptions.querySelectorAll('.option-item');
        opts.forEach((opt, idx) => {
            if (idx === selectedSubIdx) opt.classList.add('selected');
            else opt.classList.remove('selected');
        });
    }

    // --- MÁQUINA DE ESCRIBIR ---
    let typeInterval;
    function typeText(text, callback, saveAsMain = false) {
        clearInterval(typeInterval);
        isTyping = true;
        currentFullText = text;
        currentTypeCallback = callback || null;
        if (saveAsMain) lastMainDialogue = text;

        menuOptions.style.display = 'none';

    function confirmAttackHit() {
        if (!inAttackBar || barStopped) return;
        barStopped = true;

        const w = atkCanvas.width;
        const center = w / 2;
        const distFromCenter = Math.abs(barX - center);

        let dmg = 0;
        if (distFromCenter <= 9) {
            dmg = 45;
            barResultText = "¡CRÍTICO FELINO! (45 PS)";
            barResultColor = "#ffff00";
            playBlip(920, 0.24, 'sawtooth');
        } else if (distFromCenter <= 45) {
            dmg = 25;
            barResultText = "¡BUEN GOLPE! (25 PS)";
            barResultColor = "#00ff00";
            playBlip(500, 0.18, 'square');
        } else if (distFromCenter <= 165) {
            dmg = 15;
            barResultText = "ROCE LEVE (15 PS)";
            barResultColor = "#00ffff";
            playBlip(260, 0.15, 'square');
        } else {
            dmg = 0;
            barResultText = "¡FALLASTE!";
            barResultColor = "#ff4444";
            playBlip(110, 0.25, 'sawtooth');
        }

        setTimeout(() => {
            inAttackBar = false;
            atkCanvas.style.display = 'none';
            resolveAttackDamage(dmg);
        }, 620);
    }

    function attackBarLoop() {
        if (!inAttackBar) return;

        const w = atkCanvas.width;
        const center = w / 2;

        atkCtx.clearRect(0, 0, w, atkCanvas.height);

        atkCtx.fillStyle = "#330000";
        atkCtx.fillRect(20, 45, w - 40, 80);

        atkCtx.fillStyle = "#003344";
        atkCtx.fillRect(center - 165, 45, 330, 80);

        atkCtx.fillStyle = "#005500";
        atkCtx.fillRect(center - 45, 45, 90, 80);

        atkCtx.fillStyle = "#ffaa00";
        atkCtx.fillRect(center - 9, 45, 18, 80);

        atkCtx.fillStyle = "#ffffff";
        atkCtx.fillRect(center - 2, 38, 4, 94);

        atkCtx.strokeStyle = "#ffffff";
        atkCtx.lineWidth = 3;
        atkCtx.strokeRect(20, 45, w - 40, 80);

        atkCtx.font = "11px 'Press Start 2P', monospace";
        atkCtx.textAlign = "center";
        if (!barStopped) {
            atkCtx.fillStyle = "#aaaaaa";
            atkCtx.fillText("PULSA [Z] EN EL CENTRO", center, 25);
            barX += barSpeed;

            if (barX >= w - 20) {
                barStopped = true;
                barResultText = "¡MUY LENTO! FALLASTE";
                barResultColor = "#ff4444";
                playBlip(110, 0.25, 'sawtooth');
                setTimeout(() => {
                    inAttackBar = false;
                    atkCanvas.style.display = 'none';
                    resolveAttackDamage(0);
                }, 620);
            }
        } else {
            atkCtx.fillStyle = barResultColor;
            atkCtx.fillText(barResultText, center, 25);
        }

        atkCtx.fillStyle = barStopped ? barResultColor : "#ffffff";
        atkCtx.fillRect(barX - 5, 35, 10, 100);
        atkCtx.strokeStyle = "#000000";
        atkCtx.lineWidth = 2;
        atkCtx.strokeRect(barX - 5, 35, 10, 100);

        requestAnimationFrame(attackBarLoop);
    }

    function resolveAttackDamage(dmg) {
        if (dmg === 0) {
            typeText("* ¡Fallas! El Michi se ríe: '¡No te ama, miau!'.", () => {
                setTimeout(() => startEnemyTurn(getRandomTaunt()), 800);
            });
            return;
        }

        const dodged = Math.random() < 0.50;

        if (dodged) {
            catBoss.classList.add('dodge-jump');
            playBlip(760, 0.11, 'triangle');

            setTimeout(() => {
                catBoss.classList.remove('dodge-jump');
            }, 520);

                setTimeout(() => startEnemyTurn(getRandomTaunt()), 800);
            });

        }

        enemyHp = Math.max(0, enemyHp - dmg);
        updatePhaseAndSprite();

        catBoss.classList.add('shake');
        document.getElementById('enemyHpBar').style.display = 'block';
        document.getElementById('enemyHpFill').style.width = ((enemyHp / maxEnemyHp) * 100) + '%';

        setTimeout(() => {
            catBoss.classList.remove('shake');
            document.getElementById('enemyHpBar').style.display = 'none';
        }, 650);

        const msg = dmg === 45
            ? `* ¡GOLPE CRÍTICO! (-${dmg} PS) El Michi se queja: '¡No te ama, miau!'`
            : `* ¡Impacto conectado! (-${dmg} PS) El Michi gruñe: '¡Eres de lo peor!'`;

        typeText(msg, () => {
            if (enemyHp <= 0) {
                setTimeout(() => winGame("defeated"), 800);
            } else {
                setTimeout(() => startEnemyTurn(getRandomTaunt()), 800);
            }
        });
    }

    // --- CONTROLES GLOBALES DE TECLADO Y JOYSTICK MÓVIL ---
    let keys = { w: false, a: false, s: false, d: false };
    let analogVec = { x: 0, y: 0 };

    function triggerAction(action) {
        if (action === "confirm") {
            if (finalSequenceActive) {
                advanceFinalSequence();
                return;
            }
            if (gameOver) {
                location.reload();
                return;
            }
            if (inAttackBar) {
                confirmAttackHit();
                return;
            }
            if (inCombat) return;
            if (isTyping) {
                finishTyping();
                return;
            }
            if (menuState === "MAIN") {
                openSubMenu(mainActions[selectedMainIdx]);
            } else if (menuState === "SUB") {
                if (subOptionCallbacks[selectedSubIdx]) {
                    playBlip(720, 0.05);
                    subOptionCallbacks[selectedSubIdx]();
                }
            }
        } else if (action === "cancel") {
            if (finalSequenceActive) return;
            if (gameOver || inAttackBar || inCombat) return;
            if (isTyping) {
                finishTyping();
                return;
            }
            if (menuState === "SUB") {
                returnToMainMenu();
            }
        } else if (action === "left" || action === "right" || action === "up" || action === "down") {
            if (gameOver || inAttackBar || inCombat || finalSequenceActive) return;
            if (isTyping) return;

            if (menuState === "MAIN") {
                if (action === "left") {
                    selectedMainIdx = (selectedMainIdx + 3) % 4;
                    highlightMainBtn();
                    playBlip(500, 0.03);
                } else if (action === "right") {
                    selectedMainIdx = (selectedMainIdx + 1) % 4;
                    highlightMainBtn();
                    playBlip(500, 0.03);
                }
            } else if (menuState === "SUB") {
                if (action === "up" && subOptionCallbacks.length > 0) {
                    selectedSubIdx = (selectedSubIdx - 1 + subOptionCallbacks.length) % subOptionCallbacks.length;
                    highlightSubOption();
                    playBlip(500, 0.03);
                } else if (action === "down" && subOptionCallbacks.length > 0) {
                    selectedSubIdx = (selectedSubIdx + 1) % subOptionCallbacks.length;
                    highlightSubOption();
                    playBlip(500, 0.03);
                }
            }
        }
    }

    function normalizeKey(e) {
        const code = e.code || "";
        const k = (e.key || "").toLowerCase();
        if (code === "KeyW" || k === "w" || code === "ArrowUp" || k === "arrowup") return "up";
        if (code === "KeyS" || k === "s" || code === "ArrowDown" || k === "arrowdown") return "down";
        if (code === "KeyA" || k === "a" || code === "ArrowLeft" || k === "arrowleft") return "left";
        if (code === "KeyD" || k === "d" || code === "ArrowRight" || k === "arrowright") return "right";
        if (code === "KeyZ" || k === "z" || code === "Enter" || k === "enter" || code === "Space" || k === " ") return "confirm";
        if (code === "KeyX" || k === "x" || code === "ShiftLeft" || code === "ShiftRight" || code === "shift" || code === "Escape" || k === "escape") return "cancel";
        return "";
    }

    function bindTapKey(el, actionName) {
        if (!el) return;
        const press = (e) => {
            e.preventDefault();
            el.classList.add('pressed');
            triggerAction(actionName);
        };
        const release = (e) => {
            if (e) e.preventDefault();
            el.classList.remove('pressed');
        };
        el.addEventListener('pointerdown', press);
        el.addEventListener('pointerup', release);
        el.addEventListener('pointerleave', release);
        el.addEventListener('pointercancel', release);
    }

    function bindMobileControls() {
        const base = document.getElementById('joystickBase');
        const knob = document.getElementById('joystickKnob');
        let activePointerId = null;
        let lastMenuStepDir = null;

        function updateJoystickFromClient(clientX, clientY) {
            const rect = base.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const maxRadius = rect.width * 0.34;

            let dx = clientX - centerX;
            let dy = clientY - centerY;
            const dist = Math.hypot(dx, dy);

            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (dy / dist) * maxRadius;
            }

            knob.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)`;

            const deadzone = maxRadius * 0.24;
            const normX = dist < deadzone ? 0 : dx / maxRadius;
            const normY = dist < deadzone ? 0 : dy / maxRadius;

            analogVec.x = normX;
            analogVec.y = normY;

            const threshold = 0.28;
            keys.a = normX < -threshold;
            keys.d = normX > threshold;
            keys.w = normY < -threshold;
            keys.s = normY > threshold;

            let currentStepDir = null;
            if (Math.abs(normX) > Math.abs(normY)) {
                if (normX < -0.45) currentStepDir = 'left';
                else if (normX > 0.45) currentStepDir = 'right';
            } else {
                if (normY < -0.45) currentStepDir = 'up';
                else if (normY > 0.45) currentStepDir = 'down';
            }

            if (currentStepDir && currentStepDir !== lastMenuStepDir) {
                triggerAction(currentStepDir);
                lastMenuStepDir = currentStepDir;
            } else if (!currentStepDir) {
                lastMenuStepDir = null;
            }
        }

        function resetJoystick() {
            activePointerId = null;
            lastMenuStepDir = null;
            analogVec.x = 0;
            analogVec.y = 0;
            keys.w = false;
            keys.a = false;
            keys.s = false;
            keys.d = false;
            knob.style.transform = 'translate(0px, 0px)';
            knob.classList.remove('active');
        }

        if (base && knob) {
            base.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                activePointerId = e.pointerId;
                base.setPointerCapture(e.pointerId);
                knob.classList.add('active');
                updateJoystickFromClient(e.clientX, e.clientY);
            });

            base.addEventListener('pointermove', (e) => {
                if (e.pointerId !== activePointerId) return;
                e.preventDefault();
                updateJoystickFromClient(e.clientX, e.clientY);
            });

            const endJoystick = (e) => {
                if (activePointerId !== null && e.pointerId !== activePointerId) return;
                e.preventDefault();
                resetJoystick();
            };

            base.addEventListener('pointerup', endJoystick);
            base.addEventListener('pointercancel', endJoystick);
            base.addEventListener('lostpointercapture', resetJoystick);
        }

        bindTapKey(document.getElementById('padZ'), 'confirm');
        bindTapKey(document.getElementById('padX'), 'cancel');
    }

    window.addEventListener("keydown", (e) => {
        const action = normalizeKey(e);
        if (action === "up") { e.preventDefault(); keys.w = true; }
        if (action === "down") { e.preventDefault(); keys.s = true; }
        if (action === "left") { e.preventDefault(); keys.a = true; }
        if (action === "right") { e.preventDefault(); keys.d = true; }
        if (action === "confirm") e.preventDefault();

        if (action) triggerAction(action);
    });

    window.addEventListener("keyup", (e) => {
        const action = normalizeKey(e);
        if (action === "up") keys.w = false;
        if (action === "down") keys.s = false;
        if (action === "left") keys.a = false;
        if (action === "right") keys.d = false;
    });

    window.addEventListener("blur", () => {
        keys.w = false;
        keys.a = false;
        keys.s = false;
        keys.d = false;
        analogVec.x = 0;
        analogVec.y = 0;
        const knob = document.getElementById('joystickKnob');
        if (knob) {
            knob.style.transform = 'translate(0px, 0px)';
            knob.classList.remove('active');
        }
        document.querySelectorAll('.zx-btn.pressed').forEach(b => b.classList.remove('pressed'));
    });

    function getSpawnEdgeAwayFromPlayer(w, h, pCenterX, pCenterY) {
        const candidates = [
            { x: 20 + Math.random() * (w - 40), y: -10 },
            { x: 20 + Math.random() * (w - 40), y: h + 10 },
            { x: -10, y: 20 + Math.random() * (h - 40) },
            { x: w + 10, y: 20 + Math.random() * (h - 40) }
        ];
        candidates.sort((a, b) => Math.hypot(b.x - pCenterX, b.y - pCenterY) - Math.hypot(a.x - pCenterX, a.y - pCenterY));
        return candidates[0];
    }

    function runAttackPattern(patternId, tick, elapsedRatio) {
        const w = canvas.width;
        const h = canvas.height;
        const cx = player.x + player.size / 2;
        const cy = player.y + player.size / 2;

        switch (patternId) {
            case 0:
                if (tick % 6 === 0) {
                    const fromLeft = Math.random() < 0.5;
                    const yPos = 22 + Math.random() * (h - 44);
                    spawnProjectile({
                        x: fromLeft ? -10 : w + 10,
                        y: yPos,
                        vx: fromLeft ? 4.4 : -4.4,
                        vy: 0,
                        shape: 'claw',
                        mechanic: 'yellow'
                    });
                }
                break;

            case 1:
                if (tick % 13 === 0) {
                    const numBells = 12;
                    const gapIdx = Math.floor(Math.random() * numBells);
                    for (let i = 0; i < numBells; i++) {
                        if (i === gapIdx) continue;
                        const ang = (Math.PI * 2 / numBells) * i;
                        spawnProjectile({
                            x: cx + Math.cos(ang) * 115,
                            y: cy + Math.sin(ang) * 115,
                            centerX: cx,
                            centerY: cy,
                            angle: ang,
                            radius: 115,
                            shape: 'bell',
                            r: 5.5,
                            mechanic: 'ring'
                        });
                    }
                }
                break;

            case 2:
                if (tick % 8 === 0) {
                    if (Math.random() < 0.5) {
                        const lx = 20 + Math.random() * (w - 40);
                        spawnLaser(lx, 0, lx, h, 26, 12);
                    } else {
                        const ly = 20 + Math.random() * (h - 40);
                        spawnLaser(0, ly, w, ly, 26, 12);
                    }
                }
                if (tick % 7 === 0) {
                    const ang = Math.atan2(cy - 10, cx - (w / 2));
                    spawnProjectile({
                        x: w / 2, y: 10,
                        vx: Math.cos(ang) * 3.8,
                        vy: Math.sin(ang) * 3.8,
                        shape: 'claw',
                        mechanic: 'normal'
                    });
                }
                break;

            case 3:
                if (tick % 11 === 0) {
                    const isBlue = (tick / 11) % 2 === 0;
                    const fromLeft = Math.random() < 0.5;
                    spawnProjectile({
                        x: fromLeft ? -12 : w + 12,
                        y: h / 2,
                        vx: fromLeft ? 3.5 : -3.5,
                        vy: 0,
                        shape: 'bar',
                        w: 12,
                        h: h,
                        mechanic: isBlue ? 'blue' : 'orange'
                    });
                }
                if (tick % 8 === 0) {
                    const fromLeft = Math.random() < 0.5;
                    const obsY = 28 + Math.random() * (h - 56);
                    spawnProjectile({
                        x: fromLeft ? -10 : w + 10,
                        y: obsY,
                        vx: fromLeft ? 2.7 : -2.7,
                        vy: (Math.random() - 0.5) * 0.9,
                        shape: 'obstacle',
                        r: 6.5,
                        mechanic: 'normal'
                    });
                }
                break;

            case 4: {
                const activeHoming = bullets.filter(b => b.mechanic === 'homing').length;
                const desiredMax = Math.min(4, 1 + Math.floor(elapsedRatio * 3.8));
                const spawnInterval = elapsedRatio < 0.35 ? 11 : (elapsedRatio < 0.7 ? 7 : 4);

                if (tick % spawnInterval === 0 && activeHoming < desiredMax) {
                    const edge = getSpawnEdgeAwayFromPlayer(w, h, cx, cy);
                    const initAng = Math.atan2(cy - edge.y, cx - edge.x);
                    const spd = 2.2 + elapsedRatio * 0.7;
                    spawnProjectile({
                        x: edge.x,
                        y: edge.y,
                        vx: Math.cos(initAng) * spd,
                        vy: Math.sin(initAng) * spd,
                        speed: spd,
                        shape: 'orb',
                        r: 5,
                        mechanic: 'homing'
                    });
                }
                break;
            }

            case 5: {
                if (tick % 9 === 0) {
                    const gapSize = 54;
                    const minGapX = 36;
                    const maxGapX = w - 36;

                    let targetGapX;
                    if (lastGapX === null) {
                        targetGapX = cx + (Math.random() - 0.5) * 30;
                    } else {
                        const maxStep = 36;
                        const delta = (Math.random() < 0.5 ? -1 : 1) * (16 + Math.random() * (maxStep - 16));
                        targetGapX = lastGapX + delta;
                    }

                    targetGapX = Math.max(minGapX, Math.min(maxGapX, targetGapX));
                    lastGapX = targetGapX;

                    const leftWidth = Math.max(0, (targetGapX - gapSize / 2) - 4);
                    const rightStart = Math.min(w - 4, targetGapX + gapSize / 2);
                    const rightWidth = Math.max(0, (w - 4) - rightStart);

                    if (leftWidth > 6) {
                        spawnProjectile({
                            x: 4 + leftWidth / 2,
                            y: -8,
                            vy: 3.85,
                            shape: 'bone',
                            w: leftWidth,
                            h: 11,
                            mechanic: 'normal'
                        });
                    }
                    if (rightWidth > 6) {
                        spawnProjectile({
                            x: rightStart + rightWidth / 2,
                            y: -8,
                            vy: 3.85,
                            shape: 'bone',
                            w: rightWidth,
                            h: 11,
                            mechanic: 'normal'
                        });
                    }
                }
                break;
            }

            case 6:
                if (tick % 6 === 0) {
                    const side = Math.floor(Math.random() * 4);
                    let sx, sy, vx, vy;
                    if (side === 0) { sx = 20 + Math.random() * (w - 40); sy = -8; vx = 0; vy = 4.2; }
                    else if (side === 1) { sx = 20 + Math.random() * (w - 40); sy = h + 8; vx = 0; vy = -4.2; }
                    else if (side === 2) { sx = -8; sy = 20 + Math.random() * (h - 40); vx = 4.2; vy = 0; }
                    else { sx = w + 8; sy = 20 + Math.random() * (h - 40); vx = -4.2; vy = 0; }

                    spawnProjectile({ x: sx, y: sy, vx, vy, shape: 'hat', r: 7, mechanic: 'boomerang' });
                }
                break;

            case 7:
                if (tick % 8 === 0) {
                    const corners = [[12, 12], [w - 12, 12], [12, h - 12], [w - 12, h - 12]];
                    const [sx, sy] = corners[Math.floor(Math.random() * corners.length)];
                    const baseAng = Math.atan2(cy - sy, cx - sx);
                    [-0.22, 0, 0.22].forEach(offset => {
                        spawnProjectile({
                            x: sx, y: sy,
                            vx: Math.cos(baseAng + offset) * 4.2,
                            vy: Math.sin(baseAng + offset) * 4.2,
                            shape: 'claw',
                            mechanic: 'normal'
                        });
                    });
                }
                break;

            case 8:
                if (tick % 13 === 0) {
                    spawnLaser(cx, 0, cx, h, 36, 12);
                    spawnLaser(0, cy, w, cy, 36, 12);
                }
                if (tick % 8 === 0) {
                    spawnProjectile({
                        x: Math.random() * w, y: -8,
                        vx: 0, vy: 3.1,
                        shape: 'bell', r: 6,
                        mechanic: 'blue'
                    });
                }
                break;

            case 9:
                if (tick % 5 === 0) {
                    const ang = Math.atan2(cy - 8, cx - (Math.random() * w));
                    spawnProjectile({
                        x: Math.random() * w, y: 8,
                        vx: Math.cos(ang) * 4.1,
                        vy: Math.sin(ang) * 4.1,
                        shape: 'claw',
                        mechanic: 'normal'
                    });
                }
                if (tick % 12 === 0) {
                    const isOrange = Math.random() < 0.5;
                    spawnProjectile({
                        x: -10, y: h / 2,
                        vx: 4.1, vy: 0,
                        shape: 'bar', w: 10, h: h,
                        mechanic: isOrange ? 'orange' : 'blue'
                    });
                }
                if (tick % 14 === 0) {
                    spawnLaser(cx, 0, cx, h, 34, 11);
                }
                break;
        }
    }

    function startEnemyTurn(enemySpeech) {
        menuState = 'BUSY';
        setButtonsEnabled(false);
        dialogueText.style.display = 'none';
        menuOptions.style.display = 'none';

        speechBubble.style.display = 'block';
        speechBubble.textContent = enemySpeech;
        playBlip(320, 0.09);

        setTimeout(() => {
            if (gameOver) return;
            speechBubble.style.display = 'none';
            inCombat = true;

            const currentPattern = pickNextAttackId();
            turnCount++;

            battleBox.classList.add('combat-mode');
            canvas.style.display = 'block';

            player.x = canvas.width / 2 - player.size / 2;
            player.y = canvas.height / 2 - player.size / 2;
            bullets = [];
            lasers = [];
            lastGapX = null;
            invulnerable = 18;

            const durationMs = 5800;
            const startTime = performance.now();
            let tick = 0;

            spawnTimer = setInterval(() => {
                if (!inCombat || gameOver) return;
                const elapsedRatio = Math.min(1, (performance.now() - startTime) / durationMs);
                runAttackPattern(currentPattern, tick, elapsedRatio);
                tick++;
            }, 115);

            turnEndTimer = setTimeout(() => {
                clearInterval(spawnTimer);
                endEnemyTurn();
            }, durationMs);

            requestAnimationFrame(combatLoop);
        }, 950);
    }

    function takePlayerDamage(amount) {
        if (invulnerable > 0) return;
        playerHp = Math.max(0, playerHp - amount);
        updateHpUI();
        invulnerable = 36;
        playBlip(115, 0.18, 'sawtooth');

        if (playerHp <= 0) {
            inCombat = false;
            clearInterval(spawnTimer);
            clearTimeout(turnEndTimer);
            triggerGameOver();
        }
    }

    function combatLoop() {
        if (!inCombat || gameOver) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const prevX = player.x;
        const prevY = player.y;

        let moveX = (keys.d ? 1 : 0) - (keys.a ? 1 : 0);
        let moveY = (keys.s ? 1 : 0) - (keys.w ? 1 : 0);

        if (Math.hypot(analogVec.x, analogVec.y) > 0.05) {
            moveX = analogVec.x;
            moveY = analogVec.y;
        } else if (moveX !== 0 && moveY !== 0) {
            const inv = 1 / Math.SQRT2;
            moveX *= inv;
            moveY *= inv;
        }

        player.x += moveX * player.speed;
        player.y += moveY * player.speed;
        player.x = Math.max(4, Math.min(canvas.width - player.size - 4, player.x));
        player.y = Math.max(4, Math.min(canvas.height - player.size - 4, player.y));

        player.isMoving = (Math.hypot(player.x - prevX, player.y - prevY) > 0.25);

        if (invulnerable > 0) invulnerable--;

        if (invulnerable % 6 < 3) {
            ctx.fillStyle = '#ff0000';
            ctx.font = '16px Arial';
            ctx.fillText('♥', player.x - 1, player.y + 12);
        }

        const pCenterX = player.x + player.size / 2;
        const pCenterY = player.y + player.size / 2;

        for (let i = lasers.length - 1; i >= 0; i--) {
            let l = lasers[i];
            l.timer++;

            if (l.timer <= l.warningFrames) {
                ctx.strokeStyle = l.timer % 4 < 2 ? '#ff0000' : '#660000';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.moveTo(l.x1, l.y1);
                ctx.lineTo(l.x2, l.y2);
                ctx.stroke();
                ctx.setLineDash([]);
            } else if (l.timer <= l.warningFrames + l.activeFrames) {
                if (l.timer === l.warningFrames + 1) playBlip(180, 0.12, 'sawtooth');
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 14;
                ctx.beginPath();
                ctx.moveTo(l.x1, l.y1);
                ctx.lineTo(l.x2, l.y2);
                ctx.stroke();

                ctx.strokeStyle = '#ff5555';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(l.x1, l.y1);
                ctx.lineTo(l.x2, l.y2);
                ctx.stroke();

                const distToLaser = pointToSegmentDist(pCenterX, pCenterY, l.x1, l.y1, l.x2, l.y2);
                if (distToLaser < 10) {
                    takePlayerDamage(8);
                    if (gameOver) return;
                }
            } else {
                lasers.splice(i, 1);
            }
        }

        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.life++;

            if (b.mechanic === 'yellow' && !b.flipped) {
                if (Math.abs(b.x - canvas.width / 2) < 18) {
                    b.flipped = true;
                    b.x = canvas.width - b.x;
                    b.vx = -b.vx * 1.15;
                    playBlip(680, 0.04, 'triangle');
                }
            } else if (b.mechanic === 'boomerang') {
                b.vx *= 0.94;
                b.vy *= 0.94;
                if (b.life === 24) {
                    const ang = Math.atan2(pCenterY - b.y, pCenterX - b.x);
                    b.vx = Math.cos(ang) * 4.5;
                    b.vy = Math.sin(ang) * 4.5;
                }
            } else if (b.mechanic === 'ring') {
                b.angle += 0.045;
                b.radius -= 1.45;
                b.x = b.centerX + Math.cos(b.angle) * b.radius;
                b.y = b.centerY + Math.sin(b.angle) * b.radius;
                if (b.radius <= 8) {
                    bullets.splice(i, 1);
                    continue;
                }
            } else if (b.mechanic === 'homing') {
                const targetAng = Math.atan2(pCenterY - b.y, pCenterX - b.x);
                const curAng = Math.atan2(b.vy, b.vx);
                let diff = targetAng - curAng;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                const turnRate = 0.045;
                const nextAng = curAng + Math.max(-turnRate, Math.min(turnRate, diff));
                b.vx = Math.cos(nextAng) * b.speed;
                b.vy = Math.sin(nextAng) * b.speed;
            }

            if (b.mechanic !== 'ring') {
                b.x += b.vx;
                b.y += b.vy;
            }

            if (b.shape === 'obstacle') {
                if (b.y < 14 || b.y > canvas.height - 14) b.vy = -b.vy;
            }

            let color = '#ffffff';
            if (b.mechanic === 'blue') color = '#00ffff';
            else if (b.mechanic === 'orange') color = '#ff9900';
            else if (b.mechanic === 'yellow') color = '#ffff00';
            else if (b.mechanic === 'boomerang') color = '#ff66ff';
            else if (b.mechanic === 'homing') color = '#ff55aa';

            ctx.fillStyle = color;

            if (b.shape === 'bar' || b.shape === 'bone') {
                ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
                if (b.shape === 'bone') {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2 - 2, 4, b.h + 4);
                    ctx.fillRect(b.x + b.w / 2 - 4, b.y - b.h / 2 - 2, 4, b.h + 4);
                }
            } else if (b.shape === 'obstacle') {
                ctx.fillStyle = '#e5e7eb';
                ctx.fillRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
                ctx.strokeStyle = '#ff4444';
                ctx.lineWidth = 2;
                ctx.strokeRect(b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
            } else if (b.shape === 'claw') {
                const ang = b.mechanic === 'ring' ? b.angle + Math.PI : Math.atan2(b.vy, b.vx);
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.rotate(ang);
                ctx.beginPath();
                ctx.moveTo(11, 0);
                ctx.quadraticCurveTo(0, -7, -9, -4);
                ctx.lineTo(-4, 0);
                ctx.lineTo(-9, 4);
                ctx.quadraticCurveTo(0, 7, 11, 0);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            } else if (b.shape === 'hat') {
                ctx.fillRect(b.x - 7, b.y + 2, 14, 3);
                ctx.fillRect(b.x - 4, b.y - 5, 8, 7);
            } else if (b.shape === 'bell') {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.fillRect(b.x - 1, b.y - 1, 2, 4);
            } else {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
            }

            if (b.x < -60 || b.x > canvas.width + 60 || b.y < -60 || b.y > canvas.height + 60) {
                bullets.splice(i, 1);
                continue;
            }

            let hit = false;
            if (b.shape === 'bar' || b.shape === 'bone') {
                hit = Math.abs(pCenterX - b.x) < (b.w / 2 + 4) && Math.abs(pCenterY - b.y) < (b.h / 2 + 4);
            } else {
                const dx = pCenterX - b.x;
                const dy = pCenterY - b.y;
                hit = Math.sqrt(dx * dx + dy * dy) < (b.r + 4.5);
            }

            if (hit) {
                if (b.mechanic === 'blue' && !player.isMoving) {
                    hit = false;
                } else if (b.mechanic === 'orange' && player.isMoving) {
                    hit = false;
                }
            }

            if (hit && invulnerable === 0) {
                takePlayerDamage(7);
                if (b.shape !== 'bar' && b.shape !== 'bone') bullets.splice(i, 1);
                if (gameOver) return;
            }
        }

        requestAnimationFrame(combatLoop);
    }

    function pointToSegmentDist(px, py, x1, y1, x2, y2) {
        const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
        if (l2 === 0) return Math.hypot(px - x1, py - y1);
        let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
        t = Math.max(0, Math.min(1, t));
        return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
    }

    function endEnemyTurn() {
        if (gameOver) return;
        inCombat = false;
        clearInterval(spawnTimer);
        bullets = [];
        lasers = [];
        lastGapX = null;
        canvas.style.display = 'none';
        battleBox.classList.remove('combat-mode');
        setButtonsEnabled(true);
        menuState = 'MAIN';
        highlightMainBtn();

        typeText(getDynamicIdleDialogue(), null, true);
    }

    function updateHpUI() {
        document.getElementById('playerHpFill').style.width = ((playerHp / maxPlayerHp) * 100) + '%';
        document.getElementById('hpText').textContent = `${playerHp} / ${maxPlayerHp}`;
    }

    // --- ANIMACIÓN DEL CORAZÓN AL MORIR ---
    function playHeartDeathAnimation(onComplete) {
        battleBox.classList.remove('combat-mode');
        canvas.style.display = 'none';
        menuOptions.style.display = 'none';
        dialogueText.style.display = 'none';
        deathCanvas.style.display = 'block';

        const w = deathCanvas.width;
        const h = deathCanvas.height;
        const cx = w / 2;
        const cy = h / 2;

        let frame = 0;
        let split = false;
        let leftHalf = { x: cx - 10, y: cy, vx: -1.6, vy: -2.6, rot: 0, vRot: -0.05 };
        let rightHalf = { x: cx + 10, y: cy, vx: 1.6, vy: -2.6, rot: 0, vRot: 0.05 };
        let shards = [];

        function drawHeartShape(c, x, y, scale, rot, halfSide = null) {
            c.save();
            c.translate(x, y);
            c.rotate(rot);
            c.scale(scale, scale);
            c.beginPath();
            c.moveTo(0, 14);
            c.bezierCurveTo(-22, -4, -18, -22, 0, -10);
            c.bezierCurveTo(18, -22, 22, -4, 0, 14);
            c.closePath();

            if (halfSide === 'left') {
                c.rect(-30, -30, 30, 60);
                c.clip();
            } else if (halfSide === 'right') {
                c.rect(0, -30, 30, 60);
                c.clip();
            }

            c.fillStyle = '#ff0000';
            c.fill();
            c.restore();
        }

        function animStep() {
            frame++;
            deathCtx.clearRect(0, 0, w, h);

            if (frame < 42) {
                const shakeX = Math.sin(frame * 1.9) * (2 + frame * 0.08);
                const pulse = 1 + Math.sin(frame * 0.45) * 0.14;
                if (frame % 10 === 1) playBlip(220, 0.08, 'sawtooth');
                drawHeartShape(deathCtx, cx + shakeX, cy, pulse, 0);
            } else {
                if (!split) {
                    split = true;
                    playBlip(130, 0.35, 'sawtooth');
                    for (let i = 0; i < 14; i++) {
                        const ang = (Math.PI * 2 / 14) * i + Math.random() * 0.3;
                        const spd = 1.4 + Math.random() * 2.8;
                        shards.push({
                            x: cx,
                            y: cy,
                            vx: Math.cos(ang) * spd,
                            vy: Math.sin(ang) * spd - 1.5,
                            size: 3 + Math.random() * 3,
                            alpha: 1
                        });
                    }
                }

                leftHalf.x += leftHalf.vx;
                leftHalf.y += leftHalf.vy;
                leftHalf.vy += 0.12;
                leftHalf.rot += leftHalf.vRot;

                rightHalf.x += rightHalf.vx;
                rightHalf.y += rightHalf.vy;
                rightHalf.vy += 0.12;
                rightHalf.rot += rightHalf.vRot;

                drawHeartShape(deathCtx, leftHalf.x, leftHalf.y, 1, leftHalf.rot, 'left');
                drawHeartShape(deathCtx, rightHalf.x, rightHalf.y, 1, rightHalf.rot, 'right');

                shards.forEach(s => {
                    s.x += s.vx;
                    s.y += s.vy;
                    s.vy += 0.1;
                    s.alpha = Math.max(0, s.alpha - 0.02);
                    deathCtx.fillStyle = `rgba(255, 50, 50, ${s.alpha})`;
                    deathCtx.fillRect(s.x, s.y, s.size, s.size);
                });
            }

            if (frame < 105) {
                requestAnimationFrame(animStep);
            } else {
                deathCanvas.style.display = 'none';
                if (onComplete) onComplete();
            }
        }

        requestAnimationFrame(animStep);
    }

    // --- FINALES ---
    function winGame(type) {
        inCombat = false;
        menuState = 'BUSY';
        clearInterval(spawnTimer);
        clearTimeout(turnEndTimer);
        canvas.style.display = 'none';
        deathCanvas.style.display = 'none';
        battleBox.classList.remove('combat-mode');
        setButtonsEnabled(false);

        if (type === "pacifist") {
            gameOver = true;
            bossMood = "happy";
            drawPixelCatBoss();
            phaseBanner.textContent = "AMISTAD CON EL MICHI";
            typeText("* ¡El Michi del Sombrero se vuelve tu aliado!\n* ¡Ronroneo de victoria!\n\n[Pulsa Z o ESPACIO para volver a jugar]");
        } else {
            enemyHp = 0;
            bossMood = "defeated";
            updatePhaseAndSprite();
            phaseBanner.textContent = "MICHI DERROTADO • RECOMPENSA";
            speechBubble.style.display = 'none';
            startDefeatMessageSequence();
        }
    }

    function triggerGameOver() {
        gameOver = true;
        menuState = 'BUSY';
        setButtonsEnabled(false);
        bossMood = "broken";
        drawPixelCatBoss();
        phaseBanner.textContent = "ALMA DESTRUIDA • 0 PS";

        playHeartDeathAnimation(() => {
            typeText("* Tu alma se ha partido en dos.\n* '¡Ja! ¡No te ama, miau!' — El Michi\n\n[Pulsa Z o ESPACIO para reintentar]");
        });
    }
</script>
